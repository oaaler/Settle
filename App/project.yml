# XcodeGen spec. Generate the project with:  cd App && xcodegen generate
name: Settle
options:
  bundleIdPrefix: com.oaaler
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""  # set via APPLE_TEAM_ID in CI / locally in Xcode
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  SettleCore:
    path: ../Packages/SettleCore

targets:
  Settle:
    type: application
    platform: iOS
    sources:
      - path: Settle
    dependencies:
      - package: SettleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaaler.settle
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Settle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  SettleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SettleTests
    dependencies:
      - target: Settle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oaaler.settle.tests

schemes:
  Settle:
    build:
      targets:
        Settle: all
        SettleTests: [test]
    test:
      targets:
        - SettleTests
      gatherCoverageData: true
