version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: swift
    directory: /Packages/SettleCore
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /tools/calibrate
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: swift
    directory: /Server
    schedule:
      interval: weekly
    groups:
      server:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories: [/Server, /web]
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
