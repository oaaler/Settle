version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: swift
    directory: /Packages/SettleCore
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /tools/calibrate
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: deps
